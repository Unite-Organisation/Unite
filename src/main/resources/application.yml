spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      credentials:
        location: ${GCP_APPLICATION_CREDENTIALS}
server:
  servlet:
    context-path: /v1/api
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_TIME}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_TIME}

storage:
  bucket: ${GCP_BUCKET_NAME}
  upload-url-ttl: 15m
  download-url-ttl: 15m
  max-file-size: 50MB

services:
  chatting:
    url: ${CHATTING_SERVICE_URL}
    apikey: ${CHATTING_API_KEY}