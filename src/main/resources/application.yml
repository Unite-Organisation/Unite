spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      credentials:
        location: ${GCP_APPLICATION_CREDENTIALS}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  servlet:
    context-path: /v1/api
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_TIME}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_TIME}

storage:
  bucket: ${GCP_BUCKET_NAME}
  upload-url-ttl: 15m
  download-url-ttl: 15m
  max-file-size: 50MB

services:
  chatting:
    url: ${CHATTING_SERVICE_URL}
    apikey: ${CHATTING_API_KEY}

mail:
  from: ${MAIL_FROM:no-reply@unite.app}
  from-name: ${MAIL_FROM_NAME:Unite}
  locale: ${MAIL_LOCALE:pl}
