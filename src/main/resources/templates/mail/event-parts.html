<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- when / where of the event, the same card in every event mail -->
<table th:fragment="details" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 28px 0; background-color:#f7f3ee; border:1px solid #ddd4c6; border-radius:10px;">
    <tr>
        <td style="padding:18px 20px;">
            <p th:text="#{mail.event.when}"
               style="margin:0 0 2px 0; font-size:12px; line-height:18px; color:#7a6f64; text-transform:uppercase; letter-spacing:0.6px;">
                Termin
            </p>
            <p th:text="${when}"
               style="margin:0; font-size:16px; line-height:24px; font-weight:600; color:#1e1a16;">
                poniedziałek, 12 października 2026 18:00
            </p>
            <th:block th:if="${location != null}">
                <p th:text="#{mail.event.where}"
                   style="margin:14px 0 2px 0; font-size:12px; line-height:18px; color:#7a6f64; text-transform:uppercase; letter-spacing:0.6px;">
                    Miejsce
                </p>
                <p th:text="${location}" style="margin:0; font-size:15px; line-height:24px; color:#3d3730;">Hala</p>
            </th:block>
            <th:block th:if="${onlineUrl != null}">
                <p th:text="#{mail.event.online}"
                   style="margin:14px 0 2px 0; font-size:12px; line-height:18px; color:#7a6f64; text-transform:uppercase; letter-spacing:0.6px;">
                    Online
                </p>
                <p style="margin:0; font-size:15px; line-height:24px; word-break:break-all;">
                    <a th:href="${onlineUrl}" th:text="${onlineUrl}" style="color:#9a3f26;">https://example.com</a>
                </p>
            </th:block>
        </td>
    </tr>
</table>

<!-- the terracotta call to action from the invitation -->
<table th:fragment="button(href, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 28px 0;">
    <tr>
        <td style="background-color:#c0563a; border-radius:10px;">
            <a th:href="${href}" th:text="${label}"
               style="display:inline-block; padding:14px 30px; font-family:'Outfit',Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">
                Otwórz wydarzenie
            </a>
        </td>
    </tr>
</table>

<!-- the link spelled out, for clients that do not render the button -->
<th:block th:fragment="link-fallback(href)">
    <p th:text="#{mail.event.link-hint}"
       style="margin:0 0 8px 0; font-size:13px; line-height:20px; color:#7a6f64;">
        Jeśli przycisk nie działa, skopiuj ten adres do przeglądarki:
    </p>
    <p style="margin:0 0 28px 0; font-size:13px; line-height:20px; word-break:break-all;">
        <a th:href="${href}" th:text="${href}" style="color:#9a3f26;">https://example.com</a>
    </p>
</th:block>

<!-- a note under a rule, the way the invitation says how long its link lives -->
<table th:fragment="note(text)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="border-top:1px solid #ddd4c6;">
    <tr>
        <td style="padding-top:20px;">
            <p th:text="${text}" style="margin:0 0 8px 0; font-size:13px; line-height:20px; color:#3d3730;">
                Uwaga.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
