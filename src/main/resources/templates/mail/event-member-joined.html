<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:text="#{mail.event.member-joined.title}"
        style="margin:0 0 18px 0; font-family:'DM Serif Display',Georgia,'Times New Roman',serif; font-size:26px; line-height:34px; font-weight:normal; color:#1e1a16;">
        Tytuł
    </h1>

    <p th:text="#{mail.event.member-joined.intro(${eventName})}"
       style="margin:0 0 24px 0; font-size:15px; line-height:24px; color:#3d3730;">
        Treść.
    </p>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 28px 0; background-color:#f7f3ee; border:1px solid #ddd4c6; border-radius:10px;">
        <tr>
            <td align="center" style="padding:22px 20px;">
                <p th:text="#{mail.event.member-joined.pin-label}"
                   style="margin:0 0 6px 0; font-size:12px; line-height:18px; color:#7a6f64; text-transform:uppercase; letter-spacing:0.6px;">
                    Twój PIN
                </p>
                <p style="margin:0 0 6px 0;">
                    <span th:text="${returnCode}"
                          style="font-family:'Courier New',Courier,monospace; font-size:36px; line-height:44px; font-weight:bold; letter-spacing:8px; color:#9a3f26; -webkit-user-select:all; -moz-user-select:all; user-select:all; cursor:pointer;">1234</span>
                </p>
                <p th:text="#{mail.event.member-joined.copy-hint}"
                   style="margin:0; font-size:13px; line-height:20px; color:#7a6f64;">
                    Kliknij kod, aby go zaznaczyć, i skopiuj.
                </p>
                <p th:text="#{mail.event.member-joined.name-label}"
                   style="margin:18px 0 2px 0; font-size:12px; line-height:18px; color:#7a6f64; text-transform:uppercase; letter-spacing:0.6px;">
                    Twoja nazwa
                </p>
                <p th:text="${displayName}"
                   style="margin:0; font-size:16px; line-height:24px; font-weight:600; color:#1e1a16;">
                    Anna
                </p>
            </td>
        </tr>
    </table>

    <th:block th:replace="~{mail/event-parts :: button(${eventLink}, #{mail.event.cta})}"></th:block>
    <th:block th:replace="~{mail/event-parts :: link-fallback(${eventLink})}"></th:block>
    <th:block th:replace="~{mail/event-parts :: note(#{mail.event.member-joined.note})}"></th:block>
</th:block>
</body>
</html>
